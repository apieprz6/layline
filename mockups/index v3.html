<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layline — Race Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#060f18}
  body.solar-theme{background:#c8c4bc}
  body.nightvision-theme{background:#000000}
  body{display:flex;justify-content:center;align-items:center;font-family:'Inter',sans-serif}
  #root{width:390px;height:844px;overflow:hidden;position:relative;box-shadow:0 0 80px rgba(0,0,0,0.8)}
  @media(max-width:420px){#root{width:100%;height:100%}body{align-items:flex-start}}
  ::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:rgba(128,128,128,0.3);border-radius:2px}
  input[type=range]{width:100%;accent-color:#00E5FF}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

// ── THEME SYSTEM ───────────────────────────────────────────
const THEMES = {
  nightvision: {
    name: 'Night Vision',
    pageBg: '#0A0000', pageBg2: '#050000',
    cardBg: '#120000', cardBgEl: '#1A0000',
    cardBorder: 'rgba(180,0,0,0.25)', cardBorderEl: 'rgba(200,0,0,0.4)',
    accent: '#CC0000', accentSoft: 'rgba(180,0,0,0.15)',
    textPrimary: '#FF4444', textSecondary: '#AA2222', textMuted: '#661111',
    headerBg: '#0D0000', headerBorder: 'rgba(180,0,0,0.2)',
    divider: 'rgba(180,0,0,0.12)',
    navBg: '#0D0000',
    btnPrimary: '#CC0000', btnPrimaryText: '#0A0000',
    statusGreen: '#AA2222', statusGreenBg: 'rgba(170,34,34,0.15)', statusGreenBorder: 'rgba(170,34,34,0.4)',
    inputBg: '#0D0000',
  },
  solar: {
    name: 'Solar — High Contrast',
    pageBg: '#F0EDE6', pageBg2: '#E8E4DC',
    cardBg: '#FFFFFF', cardBgEl: '#F5F2EC',
    cardBorder: 'rgba(0,0,0,0.15)', cardBorderEl: 'rgba(0,0,0,0.25)',
    accent: '#0044CC', accentSoft: 'rgba(0,68,204,0.1)',
    textPrimary: '#0A0A0A', textSecondary: '#2C2C2C', textMuted: '#666666',
    headerBg: '#FFFFFF', headerBorder: 'rgba(0,0,0,0.15)',
    divider: 'rgba(0,0,0,0.1)',
    navBg: '#FFFFFF',
    btnPrimary: '#0044CC', btnPrimaryText: '#FFFFFF',
    statusGreen: '#007A2F', statusGreenBg: 'rgba(0,122,47,0.1)', statusGreenBorder: 'rgba(0,122,47,0.4)',
    inputBg: '#E8E4DC',
  }
};

// ── WIND DATA ──────────────────────────────────────────────
const WIND_COLORS_DARK = [
  { color: '#64FFDA', bg: 'rgba(100,255,218,0.12)', border: 'rgba(100,255,218,0.3)', label: 'Light' },
  { color: '#00E5FF', bg: 'rgba(0,229,255,0.12)',   border: 'rgba(0,229,255,0.3)',   label: 'Medium' },
  { color: '#FFB300', bg: 'rgba(255,179,0,0.12)',   border: 'rgba(255,179,0,0.3)',   label: 'Heavy' },
  { color: '#FF5252', bg: 'rgba(255,82,82,0.12)',   border: 'rgba(255,82,82,0.3)',   label: 'Storm' },
];
const WIND_COLORS_SOLAR = [
  { color: '#007A52', bg: 'rgba(0,122,82,0.1)',   border: 'rgba(0,122,82,0.4)',   label: 'Light' },
  { color: '#0055BB', bg: 'rgba(0,85,187,0.1)',   border: 'rgba(0,85,187,0.4)',   label: 'Medium' },
  { color: '#C47000', bg: 'rgba(196,112,0,0.1)',  border: 'rgba(196,112,0,0.4)',  label: 'Heavy' },
  { color: '#CC1100', bg: 'rgba(204,17,0,0.1)',   border: 'rgba(204,17,0,0.4)',   label: 'Storm' },
];
const WIND_COLORS_NIGHTVISION = [
  { color: '#993333', bg: 'rgba(140,30,30,0.15)', border: 'rgba(140,30,30,0.4)', label: 'Light' },
  { color: '#CC2222', bg: 'rgba(180,20,20,0.15)', border: 'rgba(180,20,20,0.4)', label: 'Medium' },
  { color: '#EE3300', bg: 'rgba(220,40,0,0.15)',  border: 'rgba(220,40,0,0.4)',  label: 'Heavy' },
  { color: '#FF0000', bg: 'rgba(255,0,0,0.15)',   border: 'rgba(255,0,0,0.4)',   label: 'Storm' },
];
let _activeThemeId = 'deepwater';
// Night-vision model color remap (preserves relative brightness)
const NV_MODEL_COLORS = ['#993333','#AA2222','#BB1111','#DD2200','#EE1100','#FF0000'];
const modelColor = (originalColor, idx) => _activeThemeId === 'nightvision' ? NV_MODEL_COLORS[idx % NV_MODEL_COLORS.length] : originalColor;
const windColor = (kts) => {
  const palette = _activeThemeId === 'solar' ? WIND_COLORS_SOLAR
    : _activeThemeId === 'nightvision' ? WIND_COLORS_NIGHTVISION
    : WIND_COLORS_DARK;
  if (kts <= 8)  return palette[0];
  if (kts <= 15) return palette[1];
  if (kts <= 22) return palette[2];
  return palette[3];
};

const MODEL_DATA = [
  { name: 'NAM',   color: '#4CAF50', spd: 11, dir: 235, gust: 14 },
  { name: 'HRRR',  color: '#66BB6A', spd: 9,  dir: 240, gust: 12 },
  { name: 'HRDPS', color: '#81C784', spd: 13, dir: 238, gust: 16 },
  { name: 'MBLUE', color: '#FF8C00', spd: 11, dir: 255, gust: 15 },
  { name: 'ICON',  color: '#FFA500', spd: 14, dir: 250, gust: 18 },
  { name: 'GFS',   color: '#FF6B35', spd: 16, dir: 258, gust: 21 },
];

const MODEL_TIMES = ['17:00','18:00','19:00','20:00','21:00','22:00'];
const MODEL_TIMELINE = [
  { name:'NAM',   color:'#4CAF50', slots:[{spd:9,dir:230,gust:12},{spd:11,dir:235,gust:14},{spd:13,dir:240,gust:16},{spd:15,dir:248,gust:19},{spd:16,dir:252,gust:20},{spd:14,dir:250,gust:17}] },
  { name:'HRRR',  color:'#66BB6A', slots:[{spd:8,dir:228,gust:11},{spd:10,dir:232,gust:13},{spd:12,dir:238,gust:15},{spd:14,dir:245,gust:18},{spd:15,dir:250,gust:19},{spd:13,dir:248,gust:16}] },
  { name:'HRDPS', color:'#81C784', slots:[{spd:10,dir:232,gust:13},{spd:12,dir:237,gust:15},{spd:14,dir:242,gust:17},{spd:16,dir:250,gust:20},{spd:18,dir:255,gust:22},{spd:15,dir:253,gust:19}] },
  { name:'MBLUE', color:'#FF8C00', slots:[{spd:10,dir:248,gust:13},{spd:11,dir:252,gust:14},{spd:13,dir:255,gust:16},{spd:15,dir:260,gust:19},{spd:17,dir:265,gust:21},{spd:16,dir:262,gust:20}] },
  { name:'ICON',  color:'#FFA500', slots:[{spd:11,dir:242,gust:14},{spd:13,dir:247,gust:16},{spd:15,dir:252,gust:19},{spd:17,dir:258,gust:21},{spd:19,dir:263,gust:24},{spd:17,dir:260,gust:21}] },
  { name:'GFS',   color:'#FF6B35', slots:[{spd:13,dir:250,gust:17},{spd:14,dir:254,gust:18},{spd:17,dir:258,gust:21},{spd:19,dir:265,gust:23},{spd:22,dir:270,gust:27},{spd:19,dir:267,gust:23}] },
];

const FORECAST = [
  { time:'17:00', spd:10, dir:240, gust:13 },
  { time:'18:00', spd:12, dir:245, gust:15 },
  { time:'19:00', spd:14, dir:248, gust:17, race:true },
  { time:'20:00', spd:16, dir:255, gust:20 },
  { time:'21:00', spd:17, dir:260, gust:22 },
  { time:'22:00', spd:14, dir:258, gust:17 },
];

// Generate model grid data (48h × 6 models)
const MODEL_GRID = (() => {
  const models = ['NAM','HRRR','GFS','ICON','MBLUE','ECMWF'];
  const hours = [];
  for (let h = 0; h < 48; h += 3) {
    const d = new Date(2026,3,30,17); d.setHours(d.getHours() + h);
    hours.push(`${String(d.getHours()).padStart(2,'0')}:00`);
  }
  return {
    hours,
    rows: models.map(m => ({
      name: m,
      cells: hours.map((_, i) => ({
        spd: Math.round(8 + Math.sin(i * 0.4 + models.indexOf(m)) * 5 + Math.random() * 4),
        dir: Math.round(230 + i * 3 + Math.random() * 20),
      }))
    }))
  };
})();

// ── PRIMITIVES ─────────────────────────────────────────────
const Label = ({ children, color }) => (
  <div style={{ fontSize:9, letterSpacing:'0.12em', textTransform:'uppercase', color: color||'#5580a0', fontFamily:'Inter,sans-serif', fontWeight:500 }}>{children}</div>
);
const Mono = ({ children, size=14, color='#00E5FF', weight=500 }) => (
  <span style={{ fontFamily:'JetBrains Mono,monospace', fontSize:size, fontVariantNumeric:'tabular-nums', color, fontWeight:weight }}>{children}</span>
);
const Divider = ({ t }) => <div style={{ borderTop:`1px solid ${t.divider}`, margin:'10px 0' }} />;

const Card = ({ children, style={}, alert=false, elevated=false, t }) => (
  <div style={{
    background: alert ? 'rgba(255,179,0,0.06)' : elevated ? t.cardBgEl : t.cardBg,
    border:`1px solid ${alert ? 'rgba(255,179,0,0.25)' : elevated ? t.cardBorderEl : t.cardBorder}`,
    borderRadius:8, padding:16,
    boxShadow: elevated ? '0 4px 16px rgba(0,0,0,0.5)' : '0 2px 8px rgba(0,0,0,0.4)',
    ...style
  }}>{children}</div>
);

// ── WIND ARROW (inline) ───────────────────────────────────
const WindArrow = ({ deg, kts, size=32, color }) => {
  const c = color || windColor(kts).color;
  return (
    <svg width={size} height={size} viewBox="-14 -14 28 28">
      <g transform={`rotate(${deg})`}>
        <polygon points="0,-11 4,-4 0,-7 -4,-4" fill={c} style={{filter:`drop-shadow(0 0 4px ${c}88)`}}/>
        <rect x="-1.5" y="-4" width="3" height="10" rx="0.8" fill={`${c}33`}/>
      </g>
    </svg>
  );
};

// ── WIND COMPASS (large) ──────────────────────────────────
const WindCompass = ({ deg, kts, size=120, t }) => {
  const wc = windColor(kts); const r = size/2;
  const ringStroke = t ? t.accent : '#00E5FF';
  const labelFill = t ? `${t.accent}99` : 'rgba(0,229,255,0.4)';
  return (
    <svg width={size} height={size} viewBox={`${-r} ${-r} ${size} ${size}`}>
      <circle r={r-4} fill="none" stroke={`${ringStroke}12`} strokeWidth="1"/>
      <circle r={r-16} fill="none" stroke={`${ringStroke}0d`} strokeWidth="1"/>
      {[0,45,90,135,180,225,270,315].map(a => {
        const rad=a*Math.PI/180, r1=r-16, r2=a%90===0?r-8:r-12;
        return <line key={a} x1={Math.sin(rad)*r1} y1={-Math.cos(rad)*r1} x2={Math.sin(rad)*r2} y2={-Math.cos(rad)*r2} stroke={a%90===0?`${ringStroke}59`:`${ringStroke}26`} strokeWidth={a%90===0?1:0.5}/>;
      })}
      <text x="0" y={-(r-14)} textAnchor="middle" dominantBaseline="middle" fill={labelFill} fontSize="7" fontFamily="JetBrains Mono,monospace">N</text>
      <text x={r-14} y="0" textAnchor="middle" dominantBaseline="middle" fill={labelFill} fontSize="7" fontFamily="JetBrains Mono,monospace">E</text>
      <text x="0" y={r-14} textAnchor="middle" dominantBaseline="middle" fill={labelFill} fontSize="7" fontFamily="JetBrains Mono,monospace">S</text>
      <text x={-(r-14)} y="0" textAnchor="middle" dominantBaseline="middle" fill={labelFill} fontSize="7" fontFamily="JetBrains Mono,monospace">W</text>
      <g transform={`rotate(${deg})`}>
        <polygon points="0,-28 6,-12 0,-18 -6,-12" fill={wc.color} style={{filter:`drop-shadow(0 0 8px ${wc.color})`}}/>
        <rect x="-2" y="-12" width="4" height="22" rx="1.5" fill={`${wc.color}30`}/>
        <circle cx="0" cy="12" r="3" fill={wc.color} opacity={0.4}/>
      </g>
    </svg>
  );
};

// ── FORECAST BAR ──────────────────────────────────────────
const ForecastBar = ({ data, t }) => {
  const max = Math.max(...data.map(d=>d.gust));
  return (
    <div style={{ display:'flex', alignItems:'flex-end', gap:5, height:64 }}>
      {data.map((d,i) => {
        const wc=windColor(d.spd); const h=Math.round((d.spd/max)*48); const hg=Math.round((d.gust/max)*48);
        return (
          <div key={i} style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:3, flex:1 }}>
            <div style={{ display:'flex', alignItems:'flex-end', gap:1, height:52 }}>
              <div style={{ width:9, height:hg, background:`${wc.color}25`, borderRadius:'2px 2px 0 0', border:`1px solid ${wc.color}40`, borderBottom:'none' }}/>
              <div style={{ width:9, height:h, background:wc.color, borderRadius:'2px 2px 0 0', opacity:d.race?1:0.7, boxShadow:d.race?`0 0 8px ${wc.color}88`:'none' }}/>
            </div>
            <div style={{ fontSize:8, color:d.race?t.accent:t.textMuted, fontFamily:'JetBrains Mono,monospace' }}>{d.time.slice(0,2)}</div>
          </div>
        );
      })}
    </div>
  );
};

// ── WEATHER SYNOPSIS DATA ─────────────────────────────────
const SYNOPSIS = {
  headline: 'Building WSW breeze, veering through race window',
  body: 'A weak surface low NW of the lake is dragging a 12–17 kt WSW flow across Navy Pier through evening. Expect a 15° veer toward WNW between 19:30 and 20:00 as the gradient tightens. Models diverge after 20:00 — GFS shows a brief 19 kt push, NAM stays steady.',
  air: 58, water: 51, pressure: 1014, vis: 10, sky: 'Mostly clear',
  issued: '17:52 CDT',
};

// ── SCREEN: DASHBOARD ─────────────────────────────────────
const DashboardScreen = ({ onNav, onMenu, t }) => {
  const race=FORECAST[2]; const rwc=windColor(race.spd);
  const [forecastModel, setForecastModel] = useState('consensus'); // 'consensus' or model name
  // Build forecast data based on selected model
  const forecastData = useMemo(() => {
    if (forecastModel === 'consensus') return FORECAST;
    const m = MODEL_TIMELINE.find(x => x.name === forecastModel);
    if (!m) return FORECAST;
    return MODEL_TIMES.map((time, i) => ({
      time, spd: m.slots[i].spd, dir: m.slots[i].dir, gust: m.slots[i].gust, race: i === 2
    }));
  }, [forecastModel]);
  return (
    <div style={{ height:'100%', overflowY:'auto', paddingBottom:24 }}>
      {/* Header */}
      <div style={{ padding:'14px 14px 12px', borderBottom:`1px solid ${t.headerBorder}`, display:'flex', justifyContent:'space-between', alignItems:'center', background:t.headerBg }}>
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          <button onClick={onMenu} aria-label="Menu" style={{ background:'none', border:'none', cursor:'pointer', padding:4, marginLeft:-4, color:t.textSecondary, display:'flex', alignItems:'center' }}>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
          </button>
          <img src="../../assets/logo-icon.svg" width={24} height={24} alt="L"/>
          <div>
            <div style={{ fontFamily:'Space Grotesk,sans-serif', fontWeight:700, fontSize:15, color:t.textPrimary, letterSpacing:'-0.02em' }}>layline</div>
            <div style={{ fontSize:9, color:t.textMuted, letterSpacing:'0.06em', textTransform:'uppercase' }}>Wed Night · Navy Pier</div>
          </div>
        </div>
        <div style={{ background:t.statusGreenBg, border:`1px solid ${t.statusGreenBorder}`, borderRadius:9999, padding:'3px 8px', fontSize:10, color:t.statusGreen, fontWeight:600 }}>● Race On</div>
      </div>

      <div style={{ padding:'12px 14px 0' }}>
        {/* Hero card */}
        <Card elevated t={t} style={{ marginBottom:12 }}>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start' }}>
            <div>
              <Label color={t.accent}>Race start · 19:00 CDT</Label>
              <div style={{ fontSize:11, color:t.textSecondary, marginTop:3 }}>Starts in <Mono size={11} color={t.textPrimary}>1h 15m</Mono></div>
              <div style={{ marginTop:12 }}>
                <Label color={t.textMuted}>Wind at race time</Label>
                <div style={{ display:'flex', alignItems:'baseline', gap:6, marginTop:4 }}>
                  <Mono size={38} color={rwc.color} weight={600}>{race.spd}</Mono>
                  <div>
                    <div style={{ fontFamily:'JetBrains Mono,monospace', fontSize:12, color:t.textSecondary }}>kts</div>
                    <div style={{ fontFamily:'JetBrains Mono,monospace', fontSize:10, color:t.textMuted }}>g {race.gust}</div>
                  </div>
                </div>
                <div style={{ display:'flex', alignItems:'center', gap:6, marginTop:4 }}>
                  <WindArrow deg={race.dir} kts={race.spd} size={20}/>
                  <Mono size={13} color={t.textSecondary}>{race.dir}° WSW</Mono>
                  <div style={{ background:rwc.bg, border:`1px solid ${rwc.border}`, borderRadius:4, padding:'2px 7px', fontSize:10, color:rwc.color, fontWeight:600 }}>{rwc.label}</div>
                </div>
              </div>
            </div>
            <WindCompass deg={race.dir} kts={race.spd} size={110} t={t}/>
          </div>
        </Card>

        {/* Wind Forecast — with model selector + tap → wind rose */}
        <Card t={t} style={{ marginBottom:12 }}>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8 }}>
            <Label color={t.textSecondary}>Wind Forecast</Label>
            <div style={{ fontSize:9, color:t.textMuted, fontFamily:'JetBrains Mono,monospace' }}>avg · gust bar</div>
          </div>
          {/* Model chip selector */}
          <div style={{ display:'flex', gap:5, marginBottom:10, overflowX:'auto', paddingBottom:2 }}>
            {[{name:'consensus', color:t.accent, label:'Consensus'}, ...MODEL_TIMELINE.map((m,mi)=>({name:m.name, color:modelColor(m.color,mi), label:m.name}))].map(m => {
              const active = forecastModel === m.name;
              return (
                <button key={m.name} onClick={(e) => { e.stopPropagation(); setForecastModel(m.name); }}
                  style={{ flexShrink:0, background: active ? `${m.color}22` : 'transparent', border:`1px solid ${active ? m.color : t.cardBorder}`, borderRadius:4, padding:'3px 8px', fontSize:10, fontFamily:'JetBrains Mono,monospace', fontWeight: active ? 700 : 500, color: active ? m.color : t.textMuted, cursor:'pointer', display:'flex', alignItems:'center', gap:5, transition:'all 150ms' }}>
                  <div style={{ width:5, height:5, borderRadius:'50%', background:m.color }}/>
                  {m.label}
                </button>
              );
            })}
          </div>
          <ForecastBar data={forecastData} t={t}/>
          <Divider t={t}/>
          <div style={{ display:'flex', gap:6, marginBottom:10 }}>
            {forecastData.map((d,i) => {
              const wc=windColor(d.spd);
              return <div key={i} style={{ flex:1, textAlign:'center' }}>
                <div style={{ fontSize:9, color:d.race?t.accent:t.textMuted, fontFamily:'JetBrains Mono,monospace', marginBottom:2 }}>{d.time}</div>
                <Mono size={11} color={d.race?wc.color:t.textSecondary}>{d.spd}</Mono>
              </div>;
            })}
          </div>
          <div onClick={() => onNav('windrose')} style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'8px 0 0', borderTop:`1px solid ${t.divider}`, cursor:'pointer' }}>
            <div style={{ display:'flex', alignItems:'center', gap:6 }}>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke={t.accent} strokeWidth="1.5" strokeLinecap="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="3" x2="12" y2="21"/><line x1="3" y1="12" x2="21" y2="12"/></svg>
              <span style={{ fontSize:11, color:t.textSecondary }}>Open wind rose · all models</span>
            </div>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke={t.accent} strokeWidth="1.5" strokeLinecap="round"><polyline points="9 18 15 12 9 6"/></svg>
          </div>
        </Card>

        {/* Weather Synopsis */}
        <Card t={t} style={{ marginBottom:12 }}>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8 }}>
            <Label color={t.textSecondary}>Weather Synopsis</Label>
            <div style={{ fontSize:9, color:t.textMuted, fontFamily:'JetBrains Mono,monospace' }}>NOAA · {SYNOPSIS.issued}</div>
          </div>
          <div style={{ fontFamily:'Space Grotesk,sans-serif', fontSize:13, fontWeight:600, color:t.textPrimary, lineHeight:1.4, marginBottom:6 }}>{SYNOPSIS.headline}</div>
          <div style={{ fontSize:11.5, color:t.textSecondary, lineHeight:1.55 }}>{SYNOPSIS.body}</div>
          <Divider t={t}/>
          <div style={{ display:'flex', gap:0 }}>
            {[
              { label:'Air',   val:`${SYNOPSIS.air}°`,      sub:'F' },
              { label:'Water', val:`${SYNOPSIS.water}°`,    sub:'F' },
              { label:'Baro',  val:`${SYNOPSIS.pressure}`,  sub:'mb' },
              { label:'Vis',   val:`${SYNOPSIS.vis}`,       sub:'nm' },
              { label:'Sky',   val:SYNOPSIS.sky,            sub:''   },
            ].map((m, i, arr) => (

// ── WIND ANALYTICS HELPERS ────────────────────────────────
// Compute trend stats from minuteHistory
const computeWindStats = (station) => {
  const mh = station.minuteHistory;
  if (!mh || mh.length < 2) return null;

  // Speed: 20min avg vs 2h avg
  const recent = mh.filter(d => d.minsAgo <= 20);
  const longer = mh.filter(d => d.minsAgo <= 120);
  const avg20  = recent.reduce((s,d) => s + d.spd, 0) / recent.length;
  const avg2h  = longer.reduce((s,d) => s + d.spd, 0) / longer.length;
  const spdDelta = avg20 - avg2h;

  // Direction: veering/backing over last 2h
  // Positive delta = veering (clockwise), negative = backing
  const newest = mh[0].dir;
  const oldest = mh[mh.length - 1].dir;
  let dirDelta = newest - oldest;
  // Normalize to [-180, 180]
  while (dirDelta > 180) dirDelta -= 360;
  while (dirDelta < -180) dirDelta += 360;

  // Oscillation range (std dev of directions over last 1h)
  const lastHour = mh.filter(d => d.minsAgo <= 60);
  const meanDir = lastHour.reduce((s,d) => s + d.dir, 0) / lastHour.length;
  const dirVariance = lastHour.reduce((s,d) => s + Math.pow(d.dir - meanDir, 2), 0) / lastHour.length;
  const dirStdDev = Math.sqrt(dirVariance);
  const dirMin = Math.min(...lastHour.map(d => d.dir));
  const dirMax = Math.max(...lastHour.map(d => d.dir));
  const oscRange = dirMax - dirMin;

  // Gust factor
  const gustFactor = ((station.gust - station.spd) / station.spd * 100);

  // Speed std dev
  const spdMean = longer.reduce((s,d) => s + d.spd, 0) / longer.length;
  const spdStdDev = Math.sqrt(longer.reduce((s,d) => s + Math.pow(d.spd - spdMean, 2), 0) / longer.length);

  return { spdDelta, avg20, avg2h, dirDelta, dirStdDev, oscRange, dirMin, dirMax, gustFactor, spdStdDev };
};

// ── DIRECTION POLAR TRAIL ─────────────────────────────────
// Shows last N direction readings as a fading arc on a mini compass
const DirPolarTrail = ({ station, wc, t, size = 96 }) => {
  const mh = station.minuteHistory;
  const stats = computeWindStats(station);
  const r = size / 2;
  const innerR = r * 0.22;
  const arrowR = r * 0.62;
  const isLight = _activeThemeId === 'solar';
  const ringStroke = isLight ? 'rgba(0,0,0,0.12)' : 'rgba(128,128,128,0.1)';
  const labelFill  = isLight ? 'rgba(0,0,0,0.4)'  : 'rgba(180,180,180,0.45)';

  // Last 7 readings for the trail (newest first)
  const trail = mh.slice(0, 7);

  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ overflow:'hidden' }}>
      {/* Compass rings */}
      <circle cx={r} cy={r} r={r - 3}  fill="none" stroke={ringStroke} strokeWidth="0.8"/>
      <circle cx={r} cy={r} r={innerR} fill="none" stroke={ringStroke} strokeWidth="0.6"/>

      {/* Cardinal labels — N only for orientation, others are noise at this size */}
      <text x={r} y={r - arrowR + 8} textAnchor="middle" fontSize="6.5" fill={labelFill}
        fontFamily="JetBrains Mono,monospace" fontWeight="700">N</text>
      {/* Cardinal tick marks */}
      {[0, 90, 180, 270].map(a => {
        const rad = (a - 90) * Math.PI / 180;
        const outerT = r - 4;
        const innerT = r - 8;
        return (
          <line key={a}
            x1={r + Math.cos(rad) * innerT} y1={r + Math.sin(rad) * innerT}
            x2={r + Math.cos(rad) * outerT} y2={r + Math.sin(rad) * outerT}
            stroke={ringStroke} strokeWidth={a === 0 ? 1.5 : 0.8}/>
        );
      })}

      {/* Oscillation band: shaded arc between dirMin and dirMax over last 1h */}
      {stats && (() => {
        const bandColor = wc.color;
        const sweepDeg = stats.oscRange;
        const startDeg = stats.dirMin;
        // Draw arc sector
        const toXY = (deg, radius) => {
          const rad = (deg - 90) * Math.PI / 180;
          return [r + Math.cos(rad) * radius, r + Math.sin(rad) * radius];
        };
        const outerR = r - 4;
        const [ox1, oy1] = toXY(startDeg, outerR);
        const [ox2, oy2] = toXY(startDeg + sweepDeg, outerR);
        const [ix1, iy1] = toXY(startDeg, innerR);
        const [ix2, iy2] = toXY(startDeg + sweepDeg, innerR);
        const largeArc = sweepDeg > 180 ? 1 : 0;
        return (
          <path
            d={`M ${ix1} ${iy1} L ${ox1} ${oy1} A ${outerR} ${outerR} 0 ${largeArc} 1 ${ox2} ${oy2} L ${ix2} ${iy2} A ${innerR} ${innerR} 0 ${largeArc} 0 ${ix1} ${iy1} Z`}
            fill={bandColor} opacity="0.10" stroke={bandColor} strokeWidth="0.5" strokeOpacity="0.25"
          />
        );
      })()}

      {/* Trail dots: fading older readings */}
      {trail.slice(1).reverse().map((pt, i) => {
        const rad = (pt.dir - 90) * Math.PI / 180;
        const dotR = arrowR * 0.88;
        const cx = r + Math.cos(rad) * dotR;
        const cy = r + Math.sin(rad) * dotR;
        const opacity = 0.12 + (i / trail.length) * 0.28;
        return (
          <circle key={i} cx={cx} cy={cy} r="2.5"
            fill={wc.color} opacity={opacity}/>
        );
      })}

      {/* Trail line connecting dots */}
      {trail.length > 1 && (() => {
        const pts = trail.slice(0, 5).map(pt => {
          const rad = (pt.dir - 90) * Math.PI / 180;
          const dotR = arrowR * 0.88;
          return `${r + Math.cos(rad) * dotR},${r + Math.sin(rad) * dotR}`;
        }).reverse().join(' ');
        return (
          <polyline points={pts} fill="none"
            stroke={wc.color} strokeWidth="1" strokeOpacity="0.3"
            strokeLinejoin="round" strokeLinecap="round" strokeDasharray="2 2"/>
        );
      })()}

      {/* Current direction arrow */}
      {(() => {
        const deg = station.dir;
        const rad = (deg - 90) * Math.PI / 180;
        const tipX = r + Math.cos(rad) * arrowR;
        const tipY = r + Math.sin(rad) * arrowR;
        const baseX = r + Math.cos(rad) * innerR;
        const baseY = r + Math.sin(rad) * innerR;
        const pr = rad + Math.PI / 2;
        const hw = 4.5;
        return (
          <g>
            <polygon
              points={`${tipX},${tipY} ${baseX + Math.cos(pr)*hw},${baseY + Math.sin(pr)*hw} ${baseX - Math.cos(pr)*hw},${baseY - Math.sin(pr)*hw}`}
              fill={wc.color} style={{ filter:`drop-shadow(0 0 5px ${wc.color}99)` }}
            />
          </g>
        );
      })()}

      {/* Center dot */}
      <circle cx={r} cy={r} r="2.5" fill={wc.color} opacity="0.7"/>
    </svg>
  );
};

// ── SPEED TREND BADGE ─────────────────────────────────────
const SpeedTrendBadge = ({ stats, t }) => {
  if (!stats) return null;
  const { spdDelta, avg20, avg2h } = stats;
  const abs = Math.abs(spdDelta);
  const isBuilding = spdDelta > 0.3;
  const isDying = spdDelta < -0.3;
  const isLight = _activeThemeId === 'solar';

  let label, color, bg, border;
  if (isBuilding) {
    label = `↑ Building +${abs.toFixed(1)} kts`;
    color = isLight ? '#007A52' : '#64FFDA';
    bg = 'rgba(100,255,218,0.08)';
    border = 'rgba(100,255,218,0.25)';
  } else if (isDying) {
    label = `↓ Easing ${abs.toFixed(1)} kts`;
    color = isLight ? '#C47000' : '#FFB300';
    bg = 'rgba(255,179,0,0.08)';
    border = 'rgba(255,179,0,0.25)';
  } else {
    label = `→ Steady`;
    color = isLight ? '#666' : '#7aa0bc';
    bg = 'transparent';
    border = 'transparent';

  return (
    <div style={{ display:'inline-flex', alignItems:'center', gap:5, background:bg, border:`1px solid ${border}`, borderRadius:9999, padding:'3px 9px' }}>
      <span style={{ fontFamily:'JetBrains Mono,monospace', fontSize:9.5, color, fontWeight:600, whiteSpace:'nowrap' }}>{label}</span>
    </div>
  );
};

// ── DIR TREND BADGE ───────────────────────────────────────
const DirTrendBadge = ({ stats, t }) => {
  if (!stats) return null;
  const { dirDelta, oscRange } = stats;
  const isLight = _activeThemeId === 'solar';
  const abs = Math.abs(dirDelta);

  let label, color, bg, border;
  if (abs < 3) {
    label = `→ Steady`;
    color = isLight ? '#666' : '#7aa0bc';
    bg = 'transparent'; border = 'transparent';

    bg = 'rgba(0,229,255,0.07)'; border = 'rgba(0,229,255,0.2)';

    label = `↺ Backing −${Math.round(abs)}° / 2h`;

    color = isLight ? '#CC1100' : '#FF5252';
    bg = 'rgba(255,82,82,0.07)'; border = 'rgba(255,82,82,0.2)';

  return (

};

// Sparkline SVG for historical wind
const Sparkline = ({ data, color, width=90, height=28, showYAxis=false }) => {
  const max = Math.max(...data.map(d => d.spd), 1);
  const yAxisW = showYAxis ? 24 : 0;
  const chartW = width - yAxisW;
  const pts = data.map((d, i) => {
    const x = yAxisW + (i / (data.length - 1)) * chartW;
    const y = height - (d.spd / max) * (height - 4) - 2;
    return `${x},${y}`;
  }).join(' ');
  const area = `${yAxisW},${height} ` + pts + ` ${width},${height}`;
  // Y-axis ticks: min, mid, max
  const minSpd = Math.min(...data.map(d => d.spd));
  const midSpd = Math.round((minSpd + max) / 2);
  const yTicks = [max, midSpd, minSpd];
  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} style={{ overflow:'visible' }}>
      <defs>
        <linearGradient id={`sg-${color.replace('#','')}`} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.3"/>
          <stop offset="100%" stopColor={color} stopOpacity="0.02"/>
        </linearGradient>
      </defs>
      {/* Y-axis labels + gridlines */}
      {showYAxis && yTicks.map((spd, i) => {
        const y = height - (spd / max) * (height - 4) - 2;
        return (
          <g key={i}>
            <line x1={yAxisW} y1={y} x2={width} y2={y} stroke={`${color}18`} strokeWidth="1" strokeDasharray="2 3"/>
            <text x={yAxisW - 4} y={y + 3} textAnchor="end" fontSize="7" fontFamily="JetBrains Mono,monospace" fill={`${color}80`}>{spd}</text>
          </g>
        );
      })}
      <polygon points={area} fill={`url(#sg-${color.replace('#','')})`}/>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round"/>
      {/* Last point dot */}
      {(() => {
        const last = data[data.length - 1];
        const x = width;
        const y = height - (last.spd / max) * (height - 4) - 2;
        return <circle cx={x} cy={y} r="2.5" fill={color}/>;
      })()}
    </svg>
  );
};

// ── INLINE TWEAKS ─────────────────────────────────────────
const useTweaksInline = (defaults) => {
  const [tweaks, setTweaksState] = useState(defaults);
  const setTweak = (key, val) => {
    setTweaksState(prev => {
      const next = { ...prev, [key]: val };
      window.parent.postMessage({ type: '__edit_mode_set_keys', edits: next }, '*');
      return next;
    });
  };
  return { tweaks, setTweak };
};

const TweaksPanelInline = ({ show, onClose, children }) => {
  if (!show) return null;
  return (
    <div style={{ position:'fixed', right:12, bottom:80, zIndex:9999, width:240, background:'rgba(15,25,38,0.97)', border:'1px solid rgba(0,229,255,0.25)', borderRadius:12, boxShadow:'0 8px 32px rgba(0,0,0,0.6)', padding:14, backdropFilter:'blur(16px)' }}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12 }}>
        <span style={{ fontFamily:'Space Grotesk,sans-serif', fontWeight:600, fontSize:13, color:'#E8F4F8' }}>Tweaks</span>
        <button onClick={onClose} style={{ background:'none', border:'none', cursor:'pointer', color:'#5580a0', fontSize:16, lineHeight:1 }}>×</button>
      </div>
      {children}
    </div>
  );
};

// ── APP + TWEAKS ──────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "solar"
}/*EDITMODE-END*/;

const App = () => {
  const [screen, setScreen] = useState('dashboard');
  const [showTweaks, setShowTweaks] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  const { tweaks, setTweak } = useTweaksInline(TWEAK_DEFAULTS);
  const t = THEMES[tweaks.theme] || THEMES.deepwater;
  _activeThemeId = tweaks.theme; // set synchronously so windColor sees correct theme on this render

  useEffect(() => {
    _activeThemeId = tweaks.theme;
    document.body.className = tweaks.theme === 'solar' ? 'solar-theme' : tweaks.theme === 'nightvision' ? 'nightvision-theme' : '';
    document.getElementById('root').style.boxShadow = tweaks.theme === 'solar' ? '0 0 80px rgba(0,0,0,0.3)' : '0 0 80px rgba(0,0,0,0.8)';
  }, [tweaks.theme]);

  useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setShowTweaks(true);
      if (e.data?.type === '__deactivate_edit_mode') setShowTweaks(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const screens = { dashboard: DashboardScreen, windrose: WindRoseScreen, models: ModelGridScreen, briefing: BriefingScreen, settings: SettingsScreen };
  const Screen = screens[screen];

  return (
    <div style={{ width:'100%', height:'100%', position:'relative', background:t.pageBg, color:t.textPrimary, overflow:'hidden' }}>
      <Screen onNav={setScreen} onMenu={() => setMenuOpen(true)} t={t}/>
      <HamburgerDrawer open={menuOpen} active={screen} onNav={setScreen} onClose={() => setMenuOpen(false)} t={t}/>
      <TweaksPanelInline show={showTweaks} onClose={() => { setShowTweaks(false); window.parent.postMessage({ type:'__edit_mode_dismissed' }, '*'); }}>
        <div style={{ marginBottom:8 }}>
          <div style={{ fontSize:9, letterSpacing:'0.1em', textTransform:'uppercase', color:'#5580a0', marginBottom:8 }}>Color Theme</div>
          <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
            {[['solar','☀️ Solar — High Contrast'],['nightvision','🔴 Night Vision']].map(([val, label]) => (
              <button key={val} onClick={() => setTweak('theme', val)} style={{ background: tweaks.theme===val ? 'rgba(0,229,255,0.15)' : 'rgba(255,255,255,0.05)', border: `1px solid ${tweaks.theme===val ? 'rgba(0,229,255,0.4)' : 'rgba(255,255,255,0.1)'}`, borderRadius:6, padding:'8px 10px', color: tweaks.theme===val ? '#00E5FF' : '#7aa0bc', fontSize:12, fontFamily:'Inter,sans-serif', cursor:'pointer', textAlign:'left', transition:'all 150ms' }}>{label}</button>
            ))}
          </div>
        </div>
      </TweaksPanelInline>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
